name: Release RitmoLab

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Pubblica su GitHub Releases dopo i test
        type: boolean
        default: true

permissions:
  contents: read

concurrency: ritmolab-release

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            folder: macOS
            suffix: macOS-arm64.dmg
          - runner: windows-2025
            platform: windows
            folder: Windows
            suffix: Windows-x64.exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run electron:build -- "${{ matrix.platform }}" --smoke
      - id: package
        run: |
          version="$(node -p 'require("./package.json").version')"
          file="installers/${{ matrix.folder }}/RitmoLab-${version}-${{ matrix.suffix }}"
          test -s "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  android:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.1.0"
      - run: npm ci
      - run: npm test
      - name: Restore Android release key
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ritmolab-release.jks"
          chmod 600 "$RUNNER_TEMP/ritmolab-release.jks"
          echo "ANDROID_RELEASE_KEYSTORE=$RUNNER_TEMP/ritmolab-release.jks" >> "$GITHUB_ENV"
      - name: Build, align and verify signed release APK
        env:
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          test -n "$ANDROID_RELEASE_KEY_PASSWORD"
          npm run android:build
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: installers/Android/RitmoLab-*-Android.apk
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "build-tools;36.1.0"
      - name: Verify release APK before publication
        run: |
          apk="$(find release/android -maxdepth 1 -name 'RitmoLab-*-Android.apk' -print -quit)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/36.1.0/zipalign" -c -v 4 "$apk"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs "$apk" | tee /tmp/apksigner.txt
          grep -Eq 'Verified using v1 scheme.*: true' /tmp/apksigner.txt
          grep -Eq 'Verified using v2 scheme.*: true' /tmp/apksigner.txt
          grep -Eq 'Verified using v3 scheme.*: true' /tmp/apksigner.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          gh release create "v$version" --target "$GITHUB_SHA" --latest --generate-notes --notes-file CHANGELOG.md \
            --title "RitmoLab $version" \
            "release/macos/RitmoLab-$version-macOS-arm64.dmg" \
            "release/windows/RitmoLab-$version-Windows-x64.exe" \
            "release/android/RitmoLab-$version-Android.apk"
