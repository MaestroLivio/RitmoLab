<script>
      window.onerror = function(msg, url, line, col, err) {
        console.error("RitmoLab Error:", msg, "at", url, line, col, err);
        var root = document.getElementById("root");
        if (root && (!root.children.length || root.innerHTML.indexOf("Caricamento") !== -1)) {
          root.innerHTML = '<div style="display:flex;height:100vh;align-items:center;justify-content:center;background:#FFFBEB;font-family:sans-serif;padding:20px;">' +
            '<div style="background:white;padding:32px;border-radius:24px;border:2px solid #F87171;box-shadow:0 10px 25px rgba(0,0,0,0.1);max-width:550px;text-align:center;">' +
            '<div style="font-size:48px;margin-bottom:12px;">⚠️</div>' +
            '<h2 style="color:#991B1B;font-size:20px;font-weight:bold;margin-bottom:8px;">Avviso di Caricamento</h2>' +
            '<p style="color:#7F1D1D;font-size:13px;margin-bottom:12px;">' + msg + '</p>' +
            '<button onclick="location.reload()" style="padding:10px 24px;background:#10B981;color:white;font-weight:bold;border:none;border-radius:12px;cursor:pointer;">Ricarica Pagina</button>' +
            '</div></div>';
        }
      };
    </script>

        </div>
      </div>
    </div>
