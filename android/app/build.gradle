plugins {
    id "com.android.application"
}

android {
    namespace "it.ritmolab.app"
    compileSdk 36

    defaultConfig {
        applicationId "it.ritmolab.app"
        minSdk 23
        targetSdk 35
        versionCode 130
        versionName "1.3.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.17.0"
    implementation "androidx.webkit:webkit:1.15.0"
}
