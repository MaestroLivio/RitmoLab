plugins {
    id "com.android.application"
}

def releaseSigningValues = [
    keystore: System.getenv("ANDROID_RELEASE_KEYSTORE"),
    storePassword: System.getenv("ANDROID_RELEASE_KEYSTORE_PASSWORD"),
    keyAlias: System.getenv("ANDROID_RELEASE_KEY_ALIAS"),
    keyPassword: System.getenv("ANDROID_RELEASE_KEY_PASSWORD")
]
def releaseBuildRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase(Locale.ROOT).contains("release")
}
if (releaseBuildRequested && releaseSigningValues.values().any { !it }) {
    throw new GradleException(
        "Release Android non firmabile: configura ANDROID_RELEASE_KEYSTORE, " +
        "ANDROID_RELEASE_KEYSTORE_PASSWORD, ANDROID_RELEASE_KEY_ALIAS e " +
        "ANDROID_RELEASE_KEY_PASSWORD."
    )
}

android {
    namespace "it.ritmolab.app"
    compileSdk 36

    defaultConfig {
        applicationId "it.ritmolab.app"
        minSdk 23
        targetSdk 35
        versionCode 10302
        versionName "1.3.2"
    }

    signingConfigs {
        release {
            if (releaseSigningValues.values().every { it }) {
                storeFile file(releaseSigningValues.keystore)
                storePassword releaseSigningValues.storePassword
                keyAlias releaseSigningValues.keyAlias
                keyPassword releaseSigningValues.keyPassword
            }
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.17.0"
    implementation "androidx.webkit:webkit:1.15.0"
}
